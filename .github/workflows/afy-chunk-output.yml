name: AFY Chunk Batch Output

on:
  push:
    paths:
      - 'tools/afy-free-rank-gateway/chunk-request.json'

permissions:
  contents: write

jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chunk current batch output
        run: node tools/afy-free-rank-gateway/chunk-output.mjs tools/afy-free-rank-gateway/output/latest.json tools/afy-free-rank-gateway/output/chunks 20
      - name: Persist chunks
        run: |
          git config user.name 'afy-batch-bot'
          git config user.email 'hello@automaticforyou.com'
          git add tools/afy-free-rank-gateway/output/chunks/
          git commit -m 'AFY batch candidate chunks [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
